services:
  parser-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./output/parser_service/parsed:/app/output/parser_service/parsed
      - ./output/parser_service/uploads:/app/output/parser_service/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
