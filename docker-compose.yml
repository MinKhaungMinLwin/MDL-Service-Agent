services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  doosan-mdl-api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./output/parser_service/parsed:/app/output/parser_service/parsed
      - ./output/parser_service/uploads:/app/output/parser_service/uploads
      - ./output/chunker_service/chunks:/app/output/chunker_service/chunks
      - ./output/schedule_service:/app/output/schedule_service
      - ./data/schedule_sources/processed:/app/data/schedule_sources/processed:ro
      - ./data/schedule_sources/rules:/app/data/schedule_sources/rules:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
