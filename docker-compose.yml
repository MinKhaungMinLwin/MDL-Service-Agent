services:
  parser-service:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./output/parser_service/parsed:/app/output/parser_service/parsed
      - ./output/parser_service/uploads:/app/output/parser_service/uploads
      - ./output/chunker_service/chunks:/app/output/chunker_service/chunks
      - ./output/schedule_service:/app/output/schedule_service
      - ./04_data/schedule_sources/processed:/app/04_data/schedule_sources/processed:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
