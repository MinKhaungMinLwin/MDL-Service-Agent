[project]
name = "doosan-mdl"
version = "0.1.0"
description = "Doosan MDL parsing and matching workspace"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.11.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
]

[tool.setuptools]
packages = ["parser_service"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
